# Site estático da Masmorra do Rei Ogro.
# Copie para /etc/nginx/sites-available/masmorra, troque SEU-DOMINIO e ative:
#   sudo ln -s /etc/nginx/sites-available/masmorra /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Depois ligue o HTTPS com:  sudo certbot --nginx -d SEU-DOMINIO
server {
    listen 80;
    listen [::]:80;
    server_name SEU-DOMINIO;

    root /var/www/masmorra;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    location = /index.html { add_header Cache-Control "no-cache"; }
    location ~* \.(js|css|woff2|png)$ { add_header Cache-Control "public, max-age=604800"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
