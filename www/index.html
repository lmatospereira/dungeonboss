<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#110c18">
<title>Masmorra do Rei Ogro</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<style>
/* Layout: arena 3D em tela cheia; HUD flutuante na batalha; menus em painéis sobre a cena */
:root{
  --night:#110c18;
  --panel:#1f1629;
  --panel-hi:#2e2140;
  --rim:#4a3760;
  --well:#0d0912;
  --ink:#f8f0de;
  --muted:#b8a8c8;
  --gold:#ffc93c;
  --gold-deep:#b9740c;
  --blood:#ff4f5e;
  --heal:#6fe38c;
  --shield:#7cc7ff;
  --f-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Baloo 2','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tags,#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:8}

/* ---------- topo da batalha ---------- */
#top{position:absolute;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"room order tools" "boss boss boss";align-items:center;column-gap:12px;row-gap:8px;padding-block:10px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.room-pill{grid-area:room;display:flex;flex-direction:column;line-height:1.05;background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:2px solid var(--rim);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 #0006;min-width:0}
.room-pill span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.room-pill b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--gold);text-shadow:0 2px 0 #0008;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#order{grid-area:order;display:flex;justify-content:center;align-items:center;gap:5px;min-width:0;overflow:hidden}
.oc{flex:none;width:32px;height:32px;border-radius:50%;overflow:hidden;border:2px solid var(--rim);background:var(--panel);box-shadow:0 2px 0 #0008}
.oc img{width:100%;height:100%;object-fit:cover;display:block}
.oc.hero{border-color:#6ec6ff}
.oc.enemy{border-color:var(--blood)}
.oc.cur{width:42px;height:42px;border-width:3px;border-color:var(--gold);box-shadow:0 0 0 3px #ffc93c44,0 3px 0 #0008}
.order-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-right:4px}
.tools{grid-area:tools;display:flex;gap:6px;pointer-events:auto}
.tool{min-width:44px;height:38px;padding:0 10px;border-radius:10px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 3px 0 #000a;font-family:var(--f-display);font-size:15px;letter-spacing:.04em;display:grid;place-items:center;white-space:nowrap}
.tool svg{width:20px;height:20px;fill:currentColor}
.tool.on{background:linear-gradient(180deg,#ffd970,var(--gold) 55%,var(--gold-deep));color:#3b2304;border-color:#ffe9a8}
.tool.warn{background:linear-gradient(180deg,#ff8a8a,#c8283a);border-color:#ffc2c8;color:#fff}
.tool:active{transform:translateY(2px);box-shadow:0 1px 0 #000a}

#bossbar{grid-area:boss;justify-self:center;width:min(520px,100%);background:linear-gradient(180deg,#2a1420,#1a0d16);border:2px solid #6b2a3a;border-radius:12px;padding:6px 10px 8px;box-shadow:0 3px 0 #000a}
.bb-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bb-head b{font-family:var(--f-display);font-weight:400;font-size:16px;letter-spacing:.02em;color:#ffd9d9;text-shadow:0 2px 0 #0009;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bb-head .gem{width:18px;height:18px}
.bb-head .bst{display:flex;gap:3px}
.bb-bar{position:relative;height:14px;border-radius:7px;background:#0c060a;border:2px solid #000;overflow:hidden}
.bb-bar i{position:absolute;inset:0 auto 0 0;display:block;transition:width .35s ease}
.bb-bar .lag{background:#ffe2a0}
.bb-bar .fill{background:linear-gradient(180deg,#ff7a6e,#d8243a 60%,#9e1328)}
.bb-bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#0007 calc(10% - 2px) 10%)}
.bb-hp{font-size:12px;font-weight:800;color:#ffd9d9;font-variant-numeric:tabular-nums}

/* ---------- etiquetas sobre as unidades ---------- */
.tag{position:absolute;left:0;top:0;width:66px;will-change:transform}
.tag .tst{display:flex;gap:2px;justify-content:center;height:16px;margin-bottom:2px}
.tag .trow{display:flex;align-items:center;gap:3px}
.tag .gem{width:15px;height:15px;flex:none}
.tag .tl{flex:none;font-size:10px;font-weight:800;line-height:1;color:var(--ink);background:#120b18;border-radius:5px;padding:2px 3px;font-variant-numeric:tabular-nums}
.tbar{position:relative;flex:1;height:8px;border-radius:5px;background:#0d0710;border:2px solid #0d0710;overflow:hidden}
.tbar i{position:absolute;top:0;bottom:0;left:0;display:block;transition:width .3s ease}
.tag.hero .thp{background:linear-gradient(180deg,#9df5a8,#3fbf62)}
.tag.enemy .thp{background:linear-gradient(180deg,#ff8f8f,#e0384a)}
.tsh{background:#7cc7ffcc;z-index:1}
.tag.boss{display:none}
.si{position:relative;width:16px;height:16px;border-radius:5px;display:grid;place-items:center;background:#120b18;border:1.5px solid currentColor}
.si svg{width:11px;height:11px;fill:currentColor}
.si b{position:absolute;right:-4px;bottom:-5px;font-size:9px;line-height:1;background:#120b18;border-radius:4px;padding:1px 2px;color:var(--ink)}
.s-taunt{color:#ff6b5e}.s-shield{color:var(--shield)}.s-burn{color:#ff8a3c}.s-poison{color:#8dff6a}.s-stun{color:#ffe066}.s-enrage{color:#ff4f5e}.s-charge{color:#ff9b3c}
.gem{fill:currentColor;filter:drop-shadow(0 1px 0 #000)}

/* ---------- textos flutuantes ---------- */
.ft{position:absolute;left:0;top:0;font-family:var(--f-display);font-size:24px;line-height:1;color:#fff;white-space:nowrap;text-shadow:0 2px 0 #1b0f14,2px 0 0 #1b0f14,-2px 0 0 #1b0f14,0 -2px 0 #1b0f14,0 4px 8px #0008;will-change:transform,opacity}
.ft.crit{font-size:32px;color:var(--gold)}
.ft.heal{color:var(--heal)}
.ft.eff{font-size:15px;color:#ffa24a}
.ft.res{font-size:14px;color:#b5b0c4}
.ft.lab{font-size:14px;color:#fff3c4}
.ft.burn{color:#ff9b54;font-size:20px}
.ft.poison{color:#a6ff7c;font-size:20px}
.ft.shieldt{font-size:15px;color:var(--shield)}
.ft.callout{font-family:var(--f-body);font-weight:800;font-size:13px;letter-spacing:.02em;text-shadow:none;background:#1b1124ee;border:2px solid var(--gold);color:var(--gold);padding:3px 10px;border-radius:999px}
.ft.callout.foe{border-color:var(--blood);color:#ffd2d6}

/* ---------- faixa central ---------- */
#banner{position:absolute;left:0;right:0;top:30%;z-index:6;text-align:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#banner .b-eyebrow{font-weight:800;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
#banner .b-title{font-family:var(--f-display);font-size:clamp(30px,7vw,58px);line-height:1.02;color:var(--gold);text-wrap:balance;text-shadow:0 4px 0 #3b1d06,0 0 24px #0009}
#banner .b-sub{font-weight:700;font-size:15px;color:var(--ink);margin-top:6px;text-shadow:0 2px 4px #000}
#banner.danger .b-title{color:#ff6d6d;text-shadow:0 4px 0 #4a0a12,0 0 30px #ff2a2a66}
#banner.show{animation:bannerIn .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes bannerIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- parte de baixo da batalha ---------- */
#bottom{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:0 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;background:linear-gradient(180deg,transparent,#0b070fcc 40%)}
#bottom>*{pointer-events:auto}
#hint{max-width:640px;width:100%;min-height:22px;text-align:center;font-size:14px;font-weight:600;color:var(--muted);text-shadow:0 1px 2px #000;text-wrap:balance}
#hint b{color:var(--ink);font-weight:800}
#hint .foe{color:#ff9aa4}
#skills{display:flex;justify-content:center;gap:10px;width:100%;max-width:520px;min-height:92px;transition:opacity .2s}
#skills.wait{opacity:.4;pointer-events:none;filter:saturate(.4)}
.ab{flex:1 1 0;min-width:0;max-width:150px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 6px 6px;border-radius:16px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 4px 0 #000b;transition:transform .12s}
.ab .ai{position:relative;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff5,transparent 55%),var(--elc,#888);border:3px solid #1a1020;box-shadow:inset 0 -5px 0 #0004}
.ab .ai svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 2px 0 #0007)}
.ab .an{font-weight:800;font-size:13px;line-height:1.1;text-align:center;text-wrap:balance}
.ab .cd{position:absolute;inset:-3px;border-radius:50%;display:grid;place-items:center;background:#0b0710cc;font-family:var(--f-display);font-weight:400;font-size:24px;color:#fff}
.ab.cool{opacity:.75}
.ab.cool .an{color:var(--muted)}
.ab.sel{border-color:var(--gold);background:linear-gradient(180deg,#4a3518,#2a1d10);transform:translateY(-4px);box-shadow:0 0 0 3px #ffc93c55,0 6px 0 #000b}
.ab:active{transform:translateY(2px)}
#party{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:680px}
.card{position:relative;display:flex;align-items:center;gap:8px;min-width:0;padding:6px 8px;border-radius:14px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 3px 0 #000b;text-align:left;transition:transform .15s,border-color .15s}
.card .ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card .cn{font-weight:800;font-size:14px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbar{position:relative;height:9px;border-radius:5px;background:#0d0710;border:2px solid #0d0710;overflow:hidden}
.cbar i{position:absolute;top:0;bottom:0;left:0;display:block;transition:width .3s ease}
.chp{background:linear-gradient(180deg,#9df5a8,#3fbf62)}
.chp.low{background:linear-gradient(180deg,#ffd27a,#e08a2a)}
.chp.crit{background:linear-gradient(180deg,#ff8f8f,#e0384a)}
.csh{background:#7cc7ffcc;z-index:1}
.ct{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.cst{position:absolute;top:-8px;right:6px;display:flex;gap:2px}
.card.active{border-color:var(--gold);transform:translateY(-5px);box-shadow:0 0 0 3px #ffc93c44,0 6px 0 #000b}
.card.target{border-color:var(--heal);animation:pulseG .8s ease-in-out infinite alternate}
@keyframes pulseG{from{box-shadow:0 0 0 2px #6fe38c33,0 3px 0 #000b}to{box-shadow:0 0 0 5px #6fe38c66,0 3px 0 #000b}}
.card.dead{filter:grayscale(1) brightness(.55)}

/* retrato redondo reutilizado */
.pt{position:relative;display:inline-block;vertical-align:middle;flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 50% 35%,var(--elc),#120b18 80%);border:2px solid #120b18}
.pt img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.pt .gem{position:absolute;right:-5px;bottom:-4px;width:18px;height:18px;color:var(--elc)}
.pt .lv{position:absolute;left:-6px;bottom:-5px;min-width:22px;padding:1px 4px;border-radius:7px;background:#120b18;border:1.5px solid var(--rim);font-size:10px;font-weight:800;line-height:1.2;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums}

@media (max-width:560px){
  #top{grid-template-columns:1fr auto;grid-template-areas:"room tools" "order order" "boss boss"}
  #order{justify-content:flex-start}
  .order-label{display:none}
  .card{flex-direction:column;align-items:stretch;gap:4px;padding:6px 5px 5px;text-align:center}
  .card .pt{align-self:center;width:40px;height:40px}
  .card .cn{font-size:12px;text-align:center}
  .ct{text-align:center}
  #party{gap:6px}
  .ab{padding:7px 4px 5px;border-radius:14px}
  .ab .ai{width:44px;height:44px}
  .ab .ai svg{width:22px;height:22px}
  .ab .an{font-size:12px}
  #skills{min-height:84px;gap:8px}
  #hint{font-size:13px}
  .tool{min-width:40px;padding:0 8px;font-size:14px}
}
@media (max-height:520px) and (min-width:561px){
  #skills{min-height:70px}
  .ab{flex-direction:row;padding:5px 8px;gap:6px}
  .ab .ai{width:38px;height:38px}.ab .ai svg{width:20px;height:20px}
  .ab .an{text-align:left;font-size:12px}
  .card{padding:4px 6px}.card .pt{width:34px;height:34px}
  #bottom{gap:5px;padding-block:0 6px}
  #hint{min-height:18px;font-size:12px}
}

/* ---------- telas de menu ---------- */
#screen{position:absolute;inset:0;z-index:9;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 40%,#110c1833,#0a0710dd 80%)}
#screen.clear{background:linear-gradient(90deg,#0a0710ee,#0a071088 55%,transparent)}
.panel{width:min(560px,100%);margin:auto;display:flex;flex-direction:column;gap:16px;background:linear-gradient(180deg,#261b33f2,#170f20f2);border:3px solid var(--rim);border-radius:24px;padding:22px clamp(14px,4vw,28px);box-shadow:0 8px 0 #000c,0 20px 60px #000a}
.panel.wide{width:min(900px,100%)}
.eyebrow{margin:0;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.title{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(38px,9vw,64px);line-height:.95;color:var(--gold);text-wrap:balance;text-shadow:0 5px 0 #4a2606,0 10px 24px #000b}
.h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,36px);line-height:1;color:var(--gold);text-shadow:0 3px 0 #4a2606}
.h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.1;color:var(--ink)}
.lead{margin:0;font-size:16px;line-height:1.45;color:var(--ink);max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:13px;line-height:1.4}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .grow{flex:1;min-width:0}
.back{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 3px 0 #000a;display:grid;place-items:center}
.back svg{width:22px;height:22px;fill:currentColor}
.purse{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:999px;background:var(--well);border:2px solid #3a2a4a;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.purse svg{width:20px;height:20px}
.coin{fill:var(--gold)}
.trophy{fill:#9fd8ff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 3px 0 #000a;font-weight:800;font-size:15px;white-space:nowrap}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.gold{border-color:#ffe9a8;background:linear-gradient(180deg,#ffe07e,var(--gold) 50%,var(--gold-deep));color:#3b2304;box-shadow:0 4px 0 #6a3c05}
.btn.red{border-color:#ffb3bb;background:linear-gradient(180deg,#ff8a8a,#d8344a 55%,#9e1328);color:#fff;box-shadow:0 4px 0 #4a0a12}
.btn:disabled{opacity:.45;filter:saturate(.3)}
.btn:not(:disabled):active{transform:translateY(2px)}
.big-btn{align-self:center;min-width:240px;max-width:100%;padding:14px 28px 16px;border-radius:16px;border:3px solid #ffe9a8;background:linear-gradient(180deg,#ffe07e,var(--gold) 50%,var(--gold-deep));color:#3b2304;font-family:var(--f-display);font-size:24px;letter-spacing:.03em;text-shadow:0 1px 0 #fff6;box-shadow:0 6px 0 #6a3c05,0 10px 20px #000a;transition:transform .1s}
.big-btn:disabled{opacity:.5;filter:saturate(.3)}
.big-btn:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 #6a3c05}
.well{background:#0d0912aa;border:2px solid #3a2a4a;border-radius:14px;padding:12px 14px}
.how{margin:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.35;color:var(--muted)}
.how b{color:var(--ink)}
.wheel{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.wheel i{font-style:normal;font-weight:800}
.netline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#8a7a98;flex:none}
.dot.on{background:var(--heal);box-shadow:0 0 0 3px #6fe38c33}

/* hub */
.hub{width:min(460px,100%);margin:auto 0;display:flex;flex-direction:column;gap:14px}
.who{display:flex;align-items:center;gap:10px}
.who input{flex:1;min-width:0;height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--rim);background:var(--well);color:var(--ink);font:inherit;font-weight:800;font-size:17px}
.menu{display:flex;flex-direction:column;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;border-radius:18px;border:3px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 5px 0 #000b;text-align:left;transition:transform .1s}
.mbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #000b}
.mbtn .mi{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--mc);box-shadow:inset 0 -5px 0 #0004,0 0 0 3px #120b18}
.mbtn .mi svg{width:30px;height:30px;fill:#fff;filter:drop-shadow(0 2px 0 #0006)}
.mbtn b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.05}
.mbtn span{display:block;font-size:13px;color:var(--muted);line-height:1.25}
.mbtn.primary{border-color:#ffe9a8;background:linear-gradient(180deg,#4a3518,#2a1d10)}
.mbtn.primary b{color:var(--gold)}

/* mapa */
.map{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:3px solid #3a2a4a;background:radial-gradient(ellipse at 20% 90%,#2a4a2a 0,transparent 40%),radial-gradient(ellipse at 45% 20%,#2a2a3e 0,transparent 45%),radial-gradient(ellipse at 75% 75%,#24402c 0,transparent 40%),radial-gradient(ellipse at 95% 15%,#4a1e14 0,transparent 40%),linear-gradient(180deg,#1b1a26,#14111b)}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.map .p-port{display:none}
.mnode{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;width:120px}
.mnode .mc{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff4,transparent 55%),var(--elc);border:4px solid #120b18;box-shadow:0 0 0 3px var(--elc),0 6px 0 #000a}
.mnode .mc svg{width:32px;height:32px;fill:#fff;filter:drop-shadow(0 2px 0 #0007)}
.mnode .mn{font-family:var(--f-display);font-size:15px;line-height:1.05;text-align:center;text-shadow:0 2px 0 #000,0 0 8px #000;text-wrap:balance}
.mnode .ml{font-size:11px;font-weight:800;color:var(--muted);text-shadow:0 1px 2px #000}
.mnode .ms{display:flex;gap:1px}
.mnode .ms svg{width:15px;height:15px;fill:#3a2d48}
.mnode .ms svg.on{fill:var(--gold)}
.mnode.locked .mc{filter:grayscale(1) brightness(.5)}
.mnode.locked .mn{color:var(--muted)}
.mnode.next .mc{animation:nodePulse 1.1s ease-in-out infinite alternate}
@keyframes nodePulse{from{box-shadow:0 0 0 3px var(--elc),0 6px 0 #000a}to{box-shadow:0 0 0 8px color-mix(in srgb,var(--elc) 45%,transparent),0 6px 0 #000a}}
.mapinfo{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.mapinfo .boss{width:64px;height:64px}
.mapinfo .grow{min-width:0}

/* seleção de equipe e heróis */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.ht{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px 8px;border-radius:14px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel));box-shadow:0 3px 0 #000b;min-width:0}
.ht .pt{width:58px;height:58px}
.ht b{font-weight:800;font-size:14px;line-height:1.1}
.ht span{font-size:11px;color:var(--muted);line-height:1.1;text-align:center}
.ht .pw{font-size:11px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.ht.sel{border-color:var(--gold);background:linear-gradient(180deg,#4a3518,#2a1d10);box-shadow:0 0 0 3px #ffc93c44,0 3px 0 #000b}
.ht .num{position:absolute;top:-8px;left:-6px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#3b2304;font-weight:800;font-size:13px;border:2px solid #120b18}
.ht.locked{opacity:.55}
.ht.locked .pt img{filter:brightness(0) opacity(.6)}
.ht.focus{border-color:#6ec6ff}
.slots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.slot{width:48px;height:48px;border-radius:50%;border:2px dashed var(--rim);display:grid;place-items:center;color:var(--muted);font-weight:800}
.slot .pt{width:48px;height:48px}
.power{display:flex;align-items:center;gap:6px;font-weight:800;font-variant-numeric:tabular-nums}
.power svg{width:18px;height:18px;fill:#ffb347}
.ok{color:var(--heal)}.bad{color:#ff9aa4}
.footbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}

.detail{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.detail .pt{width:96px;height:96px;border-width:3px}
.detail .pt .gem{width:26px;height:26px}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:#0d0912aa;border:2px solid #3a2a4a;border-radius:12px;padding:6px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.xp{position:relative;height:12px;border-radius:7px;background:var(--well);border:2px solid #000;overflow:hidden}
.xp i{position:absolute;inset:0 auto 0 0;display:block;background:linear-gradient(180deg,#bfe6ff,#4aa8ff);transition:width .6s ease}
.ablist{display:flex;flex-direction:column;gap:8px}
.abrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.abrow .ai{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--elc);border:2px solid #120b18}
.abrow .ai svg{width:20px;height:20px;fill:#fff}
.abrow b{font-weight:800}
.abrow p{margin:0;font-size:13px;line-height:1.35;color:var(--muted)}

/* invasão */
.tabs{display:flex;gap:6px;background:var(--well);border:2px solid #3a2a4a;border-radius:14px;padding:4px}
.tab{flex:1;min-height:40px;border-radius:10px;border:0;background:none;font-weight:800;color:var(--muted)}
.tab.on{background:linear-gradient(180deg,var(--panel-hi),var(--panel));color:var(--ink);box-shadow:0 2px 0 #000a}
.opp{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;border:2px solid var(--rim);background:linear-gradient(180deg,var(--panel-hi),var(--panel))}
.opp .on{display:flex;flex-direction:column;gap:6px;min-width:0}
.opp .nm{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.opp .meta{display:flex;gap:12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.minis{display:flex;gap:6px}
.minis .pt{width:36px;height:36px}
.minis .pt .lv{font-size:9px;min-width:18px;left:-5px}
.rank{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto}
.rk{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--well);font-variant-numeric:tabular-nums}
.rk b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--muted);text-align:center}
.rk .rn{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rk.me{background:#3a2a14;outline:2px solid var(--gold)}
.rk:nth-child(-n+3) b{color:var(--gold)}
.loglist{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}

/* resultado */
.stars{display:flex;justify-content:center;gap:10px}
.stars svg{width:56px;height:56px;fill:#3a2d48;filter:drop-shadow(0 4px 0 #000a)}
.stars svg.on{fill:var(--gold);animation:starPop .5s cubic-bezier(.2,1.6,.4,1) both}
.stars svg:nth-child(2){width:70px;height:70px;margin-top:-10px}
@keyframes starPop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.xprows{display:flex;flex-direction:column;gap:8px}
.xprow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.xprow .nm{font-weight:800;font-size:14px;display:flex;justify-content:space-between;gap:8px}
.xprow .up{color:var(--gold);font-family:var(--f-display);font-weight:400;font-size:15px;animation:starPop .5s both}
.center{text-align:center}
.err{font-size:15px;line-height:1.5}
#toast{position:absolute;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:12;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:#1b1124f2;border:2px solid var(--gold);color:var(--ink);font-weight:700;font-size:14px;text-align:center;box-shadow:0 6px 20px #000a;pointer-events:none}

@media (max-width:560px){
  .map{aspect-ratio:3/4}
  .map .p-land{display:none}.map .p-port{display:block}
  .mnode{left:var(--mx);top:var(--my);width:104px}
  .mnode .mc{width:58px;height:58px}
  .mapinfo{grid-template-columns:auto 1fr}
  .mapinfo .btn{grid-column:1/-1}
  .stats4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .detail .pt{width:72px;height:72px}
  .tgrid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
  .ht .pt{width:50px;height:50px}
  .opp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#banner.show,.stars svg.on,.card.target,.mnode.next .mc,.xprow .up{animation:none}}

/* ---------- vitrine 3D e ficha do herói ---------- */
.teamlay{display:grid;grid-template-columns:minmax(250px,310px) minmax(0,1fr);gap:14px;align-items:start}
.teamright{display:flex;flex-direction:column;gap:12px;min-width:0}
.hcard{display:flex;flex-direction:column;border-radius:18px;border:2px solid var(--rim);background:linear-gradient(180deg,#2a1e3a,#140e1c);overflow:hidden;position:sticky;top:0}
.pv{position:relative;height:270px;background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--elc) 30%,transparent),transparent 65%),radial-gradient(ellipse at 50% 0%,#3a2a4e,#140e1c 75%);touch-action:pan-y;cursor:grab}
.pv canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.pv-hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;pointer-events:none;z-index:1}
.pv .lockmsg{position:absolute;top:10px;left:10px;z-index:1;display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:999px;background:#0d0912cc;font-size:12px;font-weight:800;color:var(--muted)}
.pv .lockmsg svg{width:14px;height:14px;fill:currentColor}
.hc-body{display:flex;flex-direction:column;gap:9px;padding:12px 14px 14px}
.hc-name{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hc-name b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;color:var(--ink)}
.lvpill{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--well);border:1.5px solid var(--rim);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;color:var(--c,var(--ink));background:color-mix(in srgb,var(--c,#888) 16%,#120b18);border:1.5px solid color-mix(in srgb,var(--c,#888) 55%,transparent)}
.chip.plain{--c:#b8a8c8}
.chip .gem{width:14px;height:14px}
.bio{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink);max-width:62ch}
.elrow{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;font-weight:800}
.up{color:var(--heal)}.down{color:#ff8f9a}
.vsboss{padding:7px 10px;border-radius:10px;font-size:12.5px;font-weight:800;line-height:1.3}
.vsboss.up{background:#6fe38c1f;border:1.5px solid #6fe38c66}
.vsboss.down{background:#ff4f5e1f;border:1.5px solid #ff4f5e66}
.vsboss.even{background:#ffffff0d;border:1.5px solid #ffffff22;color:var(--muted)}
.sbars{display:grid;grid-template-columns:auto 1fr auto;gap:5px 8px;align-items:center;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sbar{height:8px;border-radius:5px;background:var(--well);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))}
.sbars span:nth-child(3n){color:var(--ink);font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0}
.abchips{display:flex;flex-direction:column;gap:6px}
.abchip{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;font-size:12.5px;line-height:1.3}
.abchip .ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--elc);border:2px solid #120b18}
.abchip .ai svg{width:16px;height:16px;fill:#fff}
.abchip b{font-weight:800}
.abchip span{color:var(--muted)}
.ht .advb{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1}
.ht .advb.up{background:#1f4a2a;color:var(--heal);border:1.5px solid var(--heal)}
.ht .advb.down{background:#4a1a22;color:#ff8f9a;border:1.5px solid #ff8f9a}
.ht.focus{border-color:#9fd8ff;box-shadow:0 0 0 3px #9fd8ff44,0 3px 0 #000b}
.slot-btn{border:0;padding:0;background:none;border-radius:50%}
.elhelp{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.elhelp svg.tri{width:190px;height:auto;max-width:100%}
.elhelp p{margin:0;font-size:13px;line-height:1.45;color:var(--muted)}
.elhelp b{color:var(--ink)}
.tri text{font:800 10px var(--f-body);fill:var(--ink)}
.tri .lbl{font:800 8px var(--f-body);fill:var(--muted);letter-spacing:.04em}
/* vantagem na batalha */
.tag .tadv{position:absolute;right:-14px;top:12px;font-size:13px;font-weight:800;line-height:1;text-shadow:0 1px 0 #000,0 0 6px #000}
.tag .tadv.up{color:var(--heal)}.tag .tadv.down{color:#ff8f9a}
.bb-adv{font-size:12px;font-weight:800;white-space:nowrap}
.bb-weak{font-size:11px;font-weight:800;color:var(--muted);white-space:nowrap}
@media (max-width:760px){
  .teamlay{grid-template-columns:1fr}
  .hcard{position:static}
  .pv{height:210px}
  .elhelp{grid-template-columns:1fr}
  .elhelp svg.tri{width:220px;justify-self:center}
}
@media (max-width:560px){.bb-weak{display:none}}
.slot-btn{width:48px;height:48px;flex:none;cursor:pointer}
.slot-btn .pt{width:48px;height:48px}
.slot-btn:hover .pt,.slot-btn:focus-visible .pt{border-color:#ff8f9a}

function buildEnv(){

const parts=[],ppool=[];
function spawnPart(pos,o){
  if(parts.length>(LOWEND?260:520))return;
  let s=ppool.pop();
  if(!s){s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true}));scene.add(s);}
  s.visible=true;s.material.color.set(o.color);s.material.opacity=1;s.position.copy(pos);
  s.userData={v:o.v?o.v.clone():V(),life:o.life||.5,age:0,size:o.size||.3,grav:o.grav||0};s.scale.setScalar(s.userData.size);parts.push(s);
}
function burst(pos,color,n=14,speed=3,size=.3,life=.5,grav=0,up=.3){for(let i=0;i<n;i++){const v=V(rand(-1,1),rand(-up,1),rand(-1,1)).normalize().multiplyScalar(speed*rand(.35,1));spawnPart(pos,{color,size:size*rand(.6,1.3),life:life*rand(.7,1.25),v,grav});}}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const s=parts[i],d=s.userData;d.age+=dt;if(d.age>=d.life){s.visible=false;parts.splice(i,1);ppool.push(s);continue;}d.v.y+=d.grav*dt;d.v.multiplyScalar(Math.max(0,1-1.6*dt));s.position.addScaledVector(d.v,dt);const k=d.age/d.life;s.material.opacity=1-k*k;s.scale.setScalar(d.size*(1-k*.5));}}
function shockwave(pos,color,R,ms){const m=new THREE.Mesh(GEO.ring,new THREE.MeshBasicMaterial({color,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));m.rotation.x=-Math.PI/2;m.position.set(pos.x,.06,pos.z);scene.add(m);return tween(ms,k=>{m.scale.setScalar(.3+R*k);m.material.opacity=1-k;}).then(()=>{scene.remove(m);m.material.dispose();});}
function dustBurst(p){burst(V(p.x,.25,p.z),'#a89a8a',12,2.4,.5,.6,-.5,.1);}
function orb(color,size){const g=new THREE.Group();g.add(glowSprite(color,size*2.6),glowSprite(0xffffff,size*.9));return g;}
function disposeOrb(o){scene.remove(o);o.children.forEach(c=>c.material.dispose());}
async function projectile(from,to,{color='#ff8a3a',size=.35,arc=.8,ms=420,trail=1}={}){
  const o=orb(color,size);o.position.copy(from);scene.add(o);const p=V();
  await tween(ms,k=>{p.lerpVectors(from,to,k);p.y+=Math.sin(k*Math.PI)*arc;o.position.copy(p);for(let i=0;i<trail;i++)spawnPart(p,{color,size:size*rand(.5,1.1),life:.35,v:rv(.5)});},E.lin);
  disposeOrb(o);burst(to,color,16,3.2,size*.9,.45);
}
async function arrow(from,to,{arc=.7,ms=320,color=0x8a5a2b}={}){
  const g=new THREE.Group();const s=new THREE.Mesh(GEO.box,new THREE.MeshBasicMaterial({color}));s.scale.set(.04,.04,.7);g.add(s);
  const tip=new THREE.Mesh(GEO.cone,new THREE.MeshBasicMaterial({color:0xd0d6de}));tip.scale.set(.06,.16,.06);tip.rotation.x=Math.PI/2;tip.position.z=.4;g.add(tip);scene.add(g);
  const p=V(),q=V();
  await tween(ms,k=>{p.lerpVectors(from,to,k);p.y+=Math.sin(k*Math.PI)*arc;const k2=Math.min(1,k+.05);q.lerpVectors(from,to,k2);q.y+=Math.sin(k2*Math.PI)*arc;g.position.copy(p);g.lookAt(q);},E.lin);
  scene.remove(g);burst(to,'#ffe0a0',8,2,.2,.3);
}

const MAX_LVL=30;
const lm=L=>1+.1*(L-1);
const xpNeed=L=>40+40*L;
const trainCost=L=>Math.round(40*L*Math.pow(1.1,L-1));
function heroPower(k,L){const d=DEFS[k];return Math.round((d.hp*.1+d.atk*1.5)*lm(L));}
function teamPower(list){return list.reduce((s,t)=>s+heroPower(t.k,t.lvl),0);}

/* ---------- salvamento ---------- */
const SAVE_KEY='masmorra-v2';
function defaultSave(){return{v:2,name:'',gold:100,heroes:Object.fromEntries(HERO_KEYS.map(k=>[k,{lvl:1,xp:0}])),unlocked:[...STARTERS],stars:{},team:['brom','lyra','alva','vex'],defense:['brom','lyra','alva','vex'],rating:1000,wins:0,losses:0,log:[],updated:0};}
function normalizeSave(s){
  const d=defaultSave();if(!s||typeof s!=='object')return d;
  const out=Object.assign(d,s);
  for(const k of HERO_KEYS){const h=(s.heroes||{})[k];out.heroes[k]={lvl:clamp(+(h&&h.lvl)||1,1,MAX_LVL),xp:Math.max(0,+(h&&h.xp)||0)};}
  out.unlocked=[...new Set([...STARTERS,...(Array.isArray(s.unlocked)?s.unlocked:[])])].filter(k=>HERO_KEYS.includes(k));
  const okTeam=t=>Array.isArray(t)&&t.length===4&&t.every(k=>out.unlocked.includes(k))&&new Set(t).size===4;
  if(!okTeam(out.team))out.team=d.team;if(!okTeam(out.defense))out.defense=d.defense;
  out.gold=Math.max(0,Math.floor(+out.gold||0));out.rating=Math.max(0,Math.round(+out.rating||1000));
  if(!Array.isArray(out.log))out.log=[];out.log=out.log.slice(0,10);
  return out;
}
function loadLocal(){try{return normalizeSave(JSON.parse(localStorage.getItem(SAVE_KEY)||'null'));}catch(e){return defaultSave();}}
let SAVE=loadLocal();
function persist(){SAVE.updated=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}if(typeof Net!=='undefined')Net.pushSave(SAVE);}
const lvlOf=k=>SAVE.heroes[k].lvl;
const teamList=keys=>keys.map(k=>({k,lvl:lvlOf(k)}));
function grantXp(k,amt){
  const h=SAVE.heroes[k],from=h.lvl;h.xp+=amt;
  while(h.lvl<MAX_LVL&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;}
  if(h.lvl>=MAX_LVL)h.xp=0;
  return{from,to:h.lvl};
}

class Unit{
  constructor(key,side,lvl=1){
    const d=DEFS[key];this.key=key;this.def=d;this.side=side;this.el=d.el;this.lvl=lvl;
    this.maxHp=Math.round(d.hp*lm(lvl));this.hp=this.maxHp;this.baseAtk=d.atk*lm(lvl);this.spd=d.spd;this.crit=d.crit??.1;
    this.status=[];this.resetCds();
    Object.assign(this,MODELS[d.model]());
    this.scale=d.scale||1;this.root.scale.setScalar(this.scale);
    this.h=(d.height+.1)*this.scale;this.radius=d.radius*this.scale;
    const blob=new THREE.Mesh(blobGeo,blobMat);blob.rotation.x=-Math.PI/2;blob.position.y=.025;blob.scale.setScalar(d.radius*2.6);this.root.add(blob);
    const px=new THREE.Mesh(GEO.cyl,proxyMat);px.scale.set(d.radius*1.4,d.height,d.radius*1.4);px.position.y=d.height/2;px.userData.unit=this;this.root.add(px);this.proxy=px;
    this.bubble=new THREE.Mesh(GEO.sph,new THREE.MeshBasicMaterial({color:0x7cc7ff,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false}));this.bubble.scale.set(d.radius*2.1,d.height*.62,d.radius*2.1);this.bubble.position.y=d.height*.5;this.bubble.visible=false;this.root.add(this.bubble);
    this.ringMat=new THREE.MeshBasicMaterial({color:0xffc93c,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
    this.ring=new THREE.Mesh(GEO.ring,this.ringMat);this.ring.rotation.x=-Math.PI/2;this.ring.scale.setScalar(this.radius*1.7);scene.add(this.ring);
    this.phase=Math.random()*6;this.alive=true;this.timer=0;this.home=V();this.homeYaw=0;
    scene.add(this.root);this.makeTag();
  }
  get atk(){return this.baseAtk*(hasStatus(this,'enrage')?1.3:1);}
  resetCds(){this.cds={};for(const id of this.def.abilities){const a=AB[id];this.cds[id]=a.cd?(a.start??Math.ceil(a.cd/2)):0;}}
  makeTag(){
    const t=document.createElement('div');t.className='tag '+this.side+(this.def.boss?' boss':'');
    t.innerHTML=`<span class="tadv"></span><div class="tst"></div><div class="trow">${this.side==='enemy'?gemSvg(this.el):''}<span class="tl">${this.lvl}</span><div class="tbar"><i class="tsh"></i><i class="thp"></i></div></div>`;
    t.style.display='none';tagsEl.appendChild(t);this.tag=t;this.tagHp=t.querySelector('.thp');this.tagSh=t.querySelector('.tsh');this.tagSt=t.querySelector('.tst');this.tagAdv=t.querySelector('.tadv');
    this.refresh();
  }
  refresh(){
    const sh=shieldOf(this);
    this.tagHp.style.width=this.hp/this.maxHp*100+'%';this.tagSh.style.width=Math.min(100,sh/this.maxHp*100)+'%';
    this.tagSt.innerHTML=statusHtml(this);this.bubble.visible=this.alive&&sh>0;
  }
  destroy(){scene.remove(this.root);scene.remove(this.ring);this.tag.remove();this.ringMat.dispose();}
  center(){return V(this.root.position.x,this.h*.55,this.root.position.z);}
  top(){return V(this.root.position.x,this.root.position.y+this.h+.2,this.root.position.z);}
}

function addStatus(t,type,turns,value=0){
  if(!t.alive)return;
  let s=t.status.find(x=>x.type===type);
  if(s){s.turns=Math.max(s.turns,turns);s.value=type==='shield'?s.value+value:Math.max(s.value,value);s.fresh=(t===G.current);}
  else t.status.push({type,turns,value,fresh:t===G.current});
  t.refresh();refreshUI();
}
function removeStatus(t,type){t.status=t.status.filter(s=>s.type!==type);t.refresh();}
function stun(t){if(t.def.stunImmune){floatText(t,'Imune','res');return;}addStatus(t,'stun',1);floatText(t,'Atordoado!','lab');}

/* ---------- textos flutuantes e etiquetas ---------- */
const floaters=[];
function floatText(u,text,cls){
  const el=document.createElement('div');el.className='ft '+cls;el.textContent=text;fxEl.appendChild(el);
  const n=floaters.filter(f=>f.u===u&&f.age<.45).length;
  floaters.push({el,u,base:u.top(),off:n*24,age:0,life:cls.startsWith('callout')?1.3:1.1,x:cls.startsWith('callout')?0:rand(-12,12)});
}
const _p=V();
function toScreen(v){_p.copy(v).project(camera);return{x:(_p.x+1)/2*app.clientWidth,y:(1-_p.y)/2*app.clientHeight};}
function updateOverlay(dt){
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];f.age+=dt;
    if(f.age>=f.life){f.el.remove();floaters.splice(i,1);continue;}
    const s=toScreen(f.base),k=f.age/f.life;
    const pop=f.age<.12?.6+f.age/.12*.55:Math.max(1,1.15-(f.age-.12)*1.5);
    f.el.style.transform=`translate(${s.x+f.x}px,${s.y-f.off-f.age*46}px) translate(-50%,-100%) scale(${pop})`;
    f.el.style.opacity=k>.65?1-(k-.65)/.35:1;
  }
  const show=G.state==='battle'||G.state==='transition';
  for(const u of allUnits()){
    if(!u.alive||!show||!u.root.visible){u.tag.style.display='none';continue;}
    u.tag.style.display='';const s=toScreen(u.top());
    u.tag.style.transform=`translate(${s.x-33}px,${s.y-20}px)`;
  }
}

/* ---------- golpes ---------- */
function shake(a){if(!reduceMotion)G.shake=Math.max(G.shake,a);}
function flash(u){tween(220,k=>{const v=(1-k)*.9;for(const m of u.mats)m.emissive.setRGB(v,v,v*.9);});}
function knock(t){tween(260,(k,raw)=>{const s=Math.sin(raw*Math.PI);t.body.position.z=-.28*s;t.body.rotation.x=-.3*s;},E.lin);}
function hit(u,t,mult,o={}){
  if(!t.alive)return 0;
  let dmg=u.atk*mult*rand(.92,1.08);
  const em=elemMult(u.el,t.el);dmg*=em;
  const crit=Math.random()<(o.crit??u.crit);if(crit)dmg*=1.6;
  dmg*=1-(t.def.dr||0);if(o.bonus)dmg*=o.bonus;
  dmg=Math.max(1,Math.round(dmg));
  const sh=t.status.find(s=>s.type==='shield');let absorbed=0;
  if(sh&&!o.pierce){absorbed=Math.min(sh.value,dmg);sh.value-=absorbed;dmg-=absorbed;if(sh.value<=0)removeStatus(t,'shield');}
  t.hp=Math.max(0,t.hp-dmg);
  if(dmg>0)floatText(t,String(dmg),crit?'crit':'dmg');
  if(absorbed>0)floatText(t,`${absorbed} bloqueado`,'shieldt');
  if(crit){floatText(t,'CRÍTICO!','lab');if(u.side==='hero')G.stats.crits++;}
  if(em>1)floatText(t,'EFETIVO!','eff');else if(em<1)floatText(t,'Resistido','res');
  flash(t);knock(t);(crit?sfx.crit:sfx.hit)();
  if(o.heavy||crit)shake(crit?.3:.22);
  burst(t.center(),crit?'#ffd75e':'#ffffff',crit?16:9,3,.25,.35);
  if(u.side==='hero')G.stats.dmg+=dmg;
  t.refresh();
  if(t.hp<=0)kill(t);
  refreshUI();return dmg;
}
function healUnit(t,amt){if(!t.alive)return;const before=t.hp;t.hp=Math.min(t.maxHp,t.hp+Math.round(amt));floatText(t,'+'+(t.hp-before),'heal');t.refresh();refreshUI();}
function healFx(u){const p=u.root.position;shockwave(p,'#6fe38c',u.radius*2.6,600);for(let i=0;i<20;i++){const a=rand(0,Math.PI*2),r=rand(.2,u.radius*1.3);spawnPart(V(p.x+Math.cos(a)*r,rand(.1,u.h*.6),p.z+Math.sin(a)*r),{color:Math.random()<.5?'#9dffb4':'#ffe9a0',size:rand(.15,.32),life:rand(.6,1),v:V(0,rand(1.2,2.6),0)});}}
function kill(t){
  t.alive=false;t.status=[];t.refresh();sfx.death();
  const p=tween(650,k=>{t.body.rotation.x=-1.35*k;t.body.position.y=-.1*k;},E.out)
    .then(()=>{burst(t.center(),'#9b8ab8',22,2.5,.55,.7,.6);return tween(260,k=>t.root.scale.setScalar(t.scale*(1-k)));})
    .then(()=>{t.root.visible=false;});
  G.deaths.push(p);
}
async function waitDeaths(){const d=G.deaths.splice(0);if(d.length)await Promise.all(d);}

function faceTo(u,pos,ms=150){const target=Math.atan2(pos.x-u.root.position.x,pos.z-u.root.position.z),start=u.root.rotation.y,d=angDiff(start,target);return tween(ms,k=>{u.root.rotation.y=start+d*k;});}
function faceYaw(u,yaw,ms=180){const start=u.root.rotation.y,d=angDiff(start,yaw);return tween(ms,k=>{u.root.rotation.y=start+d*k;});}
function raise(u,a,ms=200,side='R'){const arm=side==='R'?u.armR:u.armL,s=arm.rotation.x;return tween(ms,k=>{arm.rotation.x=s+(a-s)*k;});}
function lower(u,side='R'){return raise(u,0,180,side);}
function orbPos(u){const v=V();(u.orb||u.handR).getWorldPosition(v);return v;}
function handPos(u,side='R'){const v=V();(side==='R'?u.handR:u.handL).getWorldPosition(v);return v;}
async function melee(u,t,onHit){
  const from=u.root.position.clone();
  const dir=V().subVectors(t.root.position,from);dir.y=0;dir.normalize();
  const to=t.root.position.clone().addScaledVector(dir,-(t.radius+u.radius+.2));to.y=0;
  await faceTo(u,t.root.position,110);sfx.whoosh();
  await tween(300,k=>{u.root.position.lerpVectors(from,to,k);u.root.position.y=Math.sin(k*Math.PI)*.6;},E.inOut);
  await tween(120,k=>{u.armR.rotation.x=-2.9*k;u.body.rotation.x=-.18*k;});
  await tween(90,k=>{u.armR.rotation.x=-2.9+2.1*k;u.body.rotation.x=-.18+.5*k;},E.lin);
  await onHit();
  await wait(200);
  await tween(150,k=>{u.armR.rotation.x=-.8*(1-k);u.body.rotation.x=.32*(1-k);});
  await tween(300,k=>{u.root.position.lerpVectors(to,from,k);u.root.position.y=Math.sin(k*Math.PI)*.45;},E.inOut);
  u.root.position.copy(u.home);
}
function sideCenter(side){const L=SLOTS[G.layout],c=side==='hero'?L.hc:L.ec;return V(c[0],0,c[1]);}
async function leapTo(u,to,h=1.4,ms=360){const from=u.root.position.clone();await tween(ms,k=>{u.root.position.lerpVectors(from,to,k);u.root.position.y=Math.sin(k*Math.PI)*h;},E.inOut);return from;}
async function bigSlam(u,mult,o){
  const to=sideCenter(u.side==='hero'?'enemy':'hero').lerp(u.root.position,.5);
  const from=await leapTo(u,to,3.2,420);
  await tween(110,k=>{u.armR.rotation.x=-3+2.6*k;u.body.rotation.x=-.25+.6*k;},E.lin);
  sfx.slam();sfx.roar();shake(.9);shockwave(to,o.color,14,800);shockwave(to,'#ffd27a',9,600);dustBurst(to);
  for(const h of foesOf(u)){dustBurst(h.root.position);hit(u,h,mult,{heavy:true});}
  await wait(500);
  await tween(160,k=>{u.armR.rotation.x=-.4*(1-k);u.body.rotation.x=.35*(1-k);});
  await leapTo(u,from,1.6,420);u.root.position.copy(u.home);
}

function abName(u,id){const bk=u.def.bk;if(bk){const m={bBasic:bk.basic,bAoe:bk.aoe,bPrep:bk.prep,bBig:bk.big,bRage:bk.rage};if(m[id])return m[id];}return AB[id].name;}

/* ================= IA ================= */
function bestFoe(u,mode){
  const foes=foesOf(u);if(!foes.length)return null;
  const taunt=foes.filter(f=>hasStatus(f,'taunt'));if(taunt.length)return taunt[0];
  if(mode==='random')return Math.random()<.4?foes.slice().sort((a,b)=>a.hp-b.hp)[0]:pick(foes);
  return foes.slice().sort((a,b)=>{const ea=elemMult(u.el,a.el),eb=elemMult(u.el,b.el);if(ea!==eb)return eb-ea;return ratio(a)-ratio(b);})[0];
}
/* IA dos heróis (usada no AUTO e pelas equipes de defesa na Invasão) */
function heroAI(u){
  const [basic,...specials]=u.def.abilities,foes=foesOf(u),friends=friendsOf(u);
  const low=friends.slice().sort((a,b)=>ratio(a)-ratio(b))[0];
  const hurt=friends.filter(f=>ratio(f)<.7).length;
  const dots=friends.some(f=>f.status.some(s=>['poison','burn','stun'].includes(s.type)));
  for(const id of specials.slice().reverse()){
    if(u.cds[id]>0)continue;const a=AB[id];
    if(a.target==='self'){if(!a.ai||a.ai(u))return{ab:id,target:u};continue;}
    if(a.target==='ally'){if(ratio(low)<.6)return{ab:id,target:low};continue;}
    if(a.target==='allies'){
      if(a.kind==='heal'&&(hurt>=2||ratio(low)<.45||(dots&&hurt>=1)))return{ab:id};
      if(a.kind==='shield'&&!friends.some(f=>shieldOf(f)>0)&&(ratio(low)<.85||foes.some(f=>f.def.boss)))return{ab:id};
      continue;}
    if(a.target==='enemies'){if(foes.length>=2||foes.some(f=>f.def.boss))return{ab:id};continue;}
    if(a.target==='enemy'){
      const t=a.aiTarget?a.aiTarget(u):bestFoe(u);if(!t)continue;
      return{ab:id,target:foes.some(f=>hasStatus(f,'taunt'))?bestFoe(u):t};}
  }
  return{ab:basic,target:bestFoe(u)};
}
function enemyAI(u){
  if(HERO_KEYS.includes(u.key))return heroAI(u);
  const ab=u.def.abilities,r=id=>u.cds[id]===0;
  if(u.def.boss){
    u.bt=(u.bt||0)+1;
    if(hasStatus(u,'charge'))return{ab:'bBig'};
    if(!u.enraged&&ratio(u)<.5)return{ab:'bRage'};
    if(u.bt%4===3)return{ab:'bPrep'};
    if(r('bAoe')&&Math.random()<.6)return{ab:'bAoe'};
    return{ab:'bBasic',target:bestFoe(u,'random')};
  }
  if(ab.includes('curaLodo')&&r('curaLodo')){const h=friendsOf(u).filter(f=>ratio(f)<.6).sort((a,b)=>ratio(a)-ratio(b))[0];if(h)return{ab:'curaLodo',target:h};}
  for(const id of['rajada','rajadaFogo'])if(ab.includes(id)&&r(id)&&foesOf(u).length>=2&&Math.random()<.8)return{ab:id};
  return{ab:ab[0],target:bestFoe(u,'random')};
}

/* ================= posicionamento e câmera ================= */
const SLOTS={
  land:{hero:[[-3.3,-2.3],[-4.7,-.6],[-3.3,1.1],[-4.7,2.8]],enemy:[[3.3,-2.2],[4.7,-.4],[3.3,1.4],[4.7,3]],boss:[4.3,-1.2],add:[[2.6,-2.9],[2.8,2.4]],show:[[2.6,1.8],[4.2,.6],[5.8,1.8],[7.4,.6]],hc:[-4,.3],ec:[4,.3]},
  port:{hero:[[-2.25,3.5],[-.75,3.1],[.75,3.1],[2.25,3.5]],enemy:[[-2.2,-1],[0,-1.7],[2.2,-1],[0,.2]],boss:[0,-2.6],add:[[-2.5,-.5],[2.5,-.5]],show:[[-2.25,3.5],[-.75,3.1],[.75,3.1],[2.25,3.5]],hc:[0,3.3],ec:[0,-1.3]}
};
function slotXZ(u){const L=SLOTS[G.layout],s=u.slot;if(s.type==='hero')return G.state==='menu'?L.show[s.i]:L.hero[s.i];if(s.type==='boss')return L.boss;if(s.type==='add')return L.add[s.i];return L.enemy[s.i];}
function placeUnit(u,snap=true){
  const [x,z]=slotXZ(u);u.home.set(x,0,z);
  const L=SLOTS[G.layout],c=u.side==='hero'?L.ec:L.hc;
  const toFoe=Math.atan2(c[0]-x,c[1]-z),toCam=Math.atan2(camBase.x-x,camBase.z-z);
  u.homeYaw=G.state==='menu'?toCam:toFoe+angDiff(toFoe,toCam)*(u.side==='hero'?.38:.3);
  if(snap){u.root.position.copy(u.home);u.root.rotation.y=u.homeYaw;}
}
const topEl=$('#top'),bottomEl=$('#bottom');
function fitCamera(){
  const w=app.clientWidth,h=app.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);
  const layout=w/h<.95?'port':'land';
  const hb=bottomEl.hidden?0:bottomEl.offsetHeight,ht=topEl.hidden?0:topEl.offsetHeight;
  const s=Math.max(0,(hb-ht)/2),H=h+2*s;
  camera.fov=layout==='port'?36:28;camera.aspect=w/H;
  const hf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const bossRoom=G.state!=='menu'&&G.rooms[G.room]&&G.rooms[G.room].boss;
  const needW=layout==='port'?6.9:13.4,needH=(layout==='port'?8.5:8.2)+(bossRoom?1.4:0);
  const dist=Math.max((needW/2)/(hf*camera.aspect),(needH/2)/hf);
  lookTarget.set(0,(layout==='port'?.7:.9)+(bossRoom?.7:0),layout==='port'?.8:.3);
  const dir=layout==='port'?V(0,.74,.67).normalize():V(0,.5,.86).normalize();
  camBase.copy(lookTarget).addScaledVector(dir,dist);
  if(s>0)camera.setViewOffset(w,H,0,2*s,w,h);else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  const changed=layout!==G.layout;G.layout=layout;
  for(const u of allUnits())if(u.alive)placeUnit(u,changed);
}
function updateCamera(dt,t){
  const desired=V();
  if(G.state==='menu'){
    const off=V().subVectors(camBase,lookTarget);off.applyAxisAngle(V(0,1,0),Math.sin(t*.15)*.3);
    desired.copy(lookTarget).add(off.multiplyScalar(G.layout==='port'?1:.8));
    if(G.layout==='land')desired.x+=2.8;
  }else desired.copy(camBase).add(V(Math.sin(t*.27)*.25,Math.sin(t*.21)*.12,0));
  camPos.lerp(desired,1-Math.exp(-dt*2.6));
  camera.position.copy(camPos);
  if(G.shake>.001){camera.position.add(rv(G.shake*.45));G.shake*=Math.exp(-dt*7);}

function updateUnits(dt,t,rt){
  for(const u of allUnits()){
    u.ring.position.set(u.root.position.x,.04,u.root.position.z);
    let op=0,col=null,sc=1;
    if(u.alive&&u.root.visible){
      const b=Math.sin(t*3.2+u.phase);u.body.position.y=b*.03;u.body.scale.set(1-b*.012,1+b*.025,1-b*.012);
      u.armL.rotation.z=-.15-b*.05;if(u.armR.rotation.x===0)u.armR.rotation.z=.15+b*.05;
      if(u.familiar){u.familiar.position.y=1.6+Math.sin(t*2+u.phase)*.12;u.familiar.rotation.y=t;}
      if(u.cape)u.cape.rotation.x=.14+Math.sin(t*2.6+u.phase)*.05+Math.min(.5,Math.abs(u.root.position.y)*.4);
      if(G.state==='battle'&&G.current===u){op=.9;col=u.side==='hero'?0xffc93c:0xff4f5e;sc=1+Math.sin(rt*5)*.06;}
      if(G.valid.includes(u)){const a=AB[G.sel];col=(a.target==='enemy'||a.target==='enemies')?0xff4f5e:0x6fe38c;op=.55+.35*Math.sin(rt*6);sc=1.05;}
      if(hasStatus(u,'charge')&&Math.random()<dt*40)spawnPart(V(u.root.position.x+rand(-1,1),rand(.2,u.h),u.root.position.z+rand(-1,1)),{color:u.def.bk?u.def.bk.bigColor:'#ff5a2a',size:rand(.2,.5),life:.7,v:V(0,rand(1,3),0)});
      if(hasStatus(u,'burn')&&Math.random()<dt*8)spawnPart(u.center().add(rv(.3)),{color:'#ff7a2a',size:.25,life:.5,v:V(0,1.6,0)});
      if(hasStatus(u,'poison')&&Math.random()<dt*6)spawnPart(u.center().add(rv(.35)),{color:'#8dff6a',size:.18,life:.6,v:V(0,1.2,0)});
      u.head.rotation.z=hasStatus(u,'stun')?Math.sin(rt*8)*.12:0;
      if(hasStatus(u,'enrage'))for(const m of u.mats)m.emissive.r=Math.max(m.emissive.r,.18+.1*Math.sin(rt*6));
    }
    if(col!==null)u.ringMat.color.setHex(col);
    u.ringMat.opacity+=(op-u.ringMat.opacity)*Math.min(1,dt*12);
    u.ring.scale.setScalar(u.radius*1.7*sc);
    u.ring.visible=u.ringMat.opacity>.01;
  }
}
function updateEnv(dt,t){
  for(const f of flames){const n=Math.sin(t*9+f.phase)*.5+Math.sin(t*17+f.phase*2)*.3+Math.sin(t*4.3+f.phase)*.2;
    f.outer.scale.y=.5*f.size*(1+n*.16);f.inner.scale.y=.3*f.size*(1+n*.2);f.glow.material.opacity=.6+n*.12;if(f.light)f.light.intensity=1.35+n*.3;}
  if(dust){const a=dust.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)+dt*.15;if(y>6)y=0;a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(t*.5+i)*dt*.05);}a.needsUpdate=true;}

}

function tickStart(u){

      burst(u.center(),s.type==='burn'?'#ff7a2a':'#8dff6a',10,2,.3,.5);
      if(u.hp<=0){kill(u);break;}
    }
  }
  u.refresh();refreshUI();
}
function endTurn(u){

}

async function perform(u,c){

  if(c.target&&c.target!==u)await faceTo(u,c.target.root.position,140);
  await ab.run(u,c.target);

}
async function battleLoop(){
  const my=G.loopId;
  while(G.state==='battle'&&my===G.loopId){
    const alive=allUnits().filter(u=>u.alive);if(!alive.length)return;
    let u=alive[0];for(const v of alive)if(v.timer<u.timer)u=v;
    G.clock=u.timer;G.current=u;G.stats.turns++;
    const hasAdv=markAdvantage(u);

    tickStart(u);
    await waitDeaths();
    if(my!==G.loopId||await checkEnd())return;
    if(u.alive){
      if(hasStatus(u,'stun')){
        skillsEl.classList.add('wait');setHint(`<b class="${u.side==='enemy'?'foe':''}">${esc(u.def.short||u.def.name)}</b> está atordoado e perde a vez.`);

          await wait(420);choice=enemyAI(u);
        }
        if(my!==G.loopId)return;
        skillsEl.classList.add('wait');refreshCards();
        await perform(u,choice);
        if(my!==G.loopId)return;
      }
      endTurn(u);
    }
    u.timer+=1000/u.spd;
    await waitDeaths();
    if(my!==G.loopId||await checkEnd())return;
  }
}
async function checkEnd(){
  if(G.state!=='battle')return true;
  if(!aliveHeroes().length){await finishBattle(false);return true;}
  if(!aliveEnemies().length){
    G.cleared++;

      G.state='transition';G.current=null;refreshUI();

    }else await finishBattle(true);
    return true;
  }

}

/* ---------- recompensas ---------- */
function computeRewards(win,quit){
  const res={win,quit,mode:G.mode,xp:[],gold:0,stars:0,unlocked:null,delta:0};
  const team=G.heroes.map(h=>h.key);
  let xp=0;
  if(G.mode==='dungeon'){
    const d=G.dungeon;
    for(let i=0;i<G.cleared;i++){const boss=!!G.rooms[i].boss,L=G.rooms[i].enemies[0].lvl;xp+=roomXp(L)*(boss?2:1);res.gold+=roomGold(L)*(boss?3:1);}
    if(win){
      res.stars=Math.max(1,aliveHeroes().length===4?3:aliveHeroes().length>=2?2:1);
      const prev=SAVE.stars[d.id]||0;if(res.stars>prev)SAVE.stars[d.id]=res.stars;
      if(!prev){res.gold+=100*d.lvl;res.firstClear=true;}
      if(d.unlockHero&&!SAVE.unlocked.includes(d.unlockHero)){SAVE.unlocked.push(d.unlockHero);res.unlocked=d.unlockHero;}
    }
  }else{
    const avg=team.reduce((s,k)=>s+lvlOf(k),0)/4;
    const exp=1/(1+Math.pow(10,(G.opp.rating-SAVE.rating)/400));
    res.delta=clamp(Math.round(32*((win?1:0)-exp)),-32,32);
    SAVE.rating=Math.max(0,SAVE.rating+res.delta);
    if(win)SAVE.wins++;else SAVE.losses++;
    res.gold=win?Math.round(60+6*avg):15;xp=win?50:15;
  }
  SAVE.gold+=res.gold;
  for(const k of team){const before={lvl:lvlOf(k),xp:SAVE.heroes[k].xp};const r=grantXp(k,xp);res.xp.push({k,before,gained:xp,to:r.to});}
  persist();
  return res;
}
async function finishBattle(win,quit=false){
  G.state='end';G.loopId++;G.current=null;G.valid=[];if(G.pending){G.pending=null;}skillsEl.classList.add('wait');refreshUI();

}

/* Sem configuração do Firebase o jogo roda offline e a Invasão usa oponentes simulados. */
const BOT_NAMES=['Tavernal','Sir Bolota','Duda Machado','Capitã Brasa','Zé das Trevas','Lumi','Rato de Cripta','Ferreiro Tonho','Bruxa Nina','Caçador Ivo','Lady Ferrugem','Bardo Beto','Gugu do Lodo','Mestre Ônix','Tia Fênix','Kiko Lâmina'];
function botTeam(avgLvl,seed){
  const keys=HERO_KEYS.slice().sort(()=>Math.random()-.5);
  const tank=['brom','rook'].includes(keys[0])?[]:[pick(['brom','rook'])];
  const team=[...new Set([...tank,...keys])].slice(0,4);
  return team.map(k=>({k,lvl:clamp(Math.round(avgLvl+rand(-1.5,1.5)),1,MAX_LVL)}));
}
function makeBots(n){
  const avg=SAVE.team.reduce((s,k)=>s+lvlOf(k),0)/4;
  return Array.from({length:n},(_,i)=>{
    const lv=avg+(i-1)*1.2,team=botTeam(Math.max(1,lv));
    return{uid:'bot-'+i+'-'+Math.random().toString(36).slice(2,6),name:pick(BOT_NAMES),rating:Math.max(0,Math.round(SAVE.rating+(i-1)*60+rand(-30,30))),team,power:teamPower(team),bot:true};
  });
}
const Net={
  online:false,uid:null,db:null,_saveTimer:0,status:'Offline',
  configured(){return typeof firebase!=='undefined'&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!/COLE_AQUI/.test(window.FIREBASE_CONFIG.apiKey);},
  async init(){
    if(!this.configured()){this.status='Offline: Invasão com oponentes simulados';return false;}
    try{
      if(!firebase.apps.length)firebase.initializeApp(window.FIREBASE_CONFIG);
      const auth=firebase.auth();
      const user=await new Promise(res=>{const off=auth.onAuthStateChanged(u=>{off();res(u);});});
      this.uid=(user||(await auth.signInAnonymously()).user).uid;
      this.db=firebase.firestore();this.online=true;this.status='Online';
      return true;
    }catch(e){console.warn('Firebase indisponível',e);this.status='Sem conexão com o servidor: jogando offline';return false;}
  },
  async pullSave(){
    if(!this.online)return null;
    try{const d=await this.db.collection('saves').doc(this.uid).get();if(!d.exists)return null;return normalizeSave(JSON.parse(d.data().save));}catch(e){console.warn(e);return null;}
  },
  pushSave(save){
    if(!this.online)return;clearTimeout(this._saveTimer);
    this._saveTimer=setTimeout(()=>{
      this.db.collection('saves').doc(this.uid).set({save:JSON.stringify(save),updatedAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>console.warn(e));
      this.publishProfile();
    },1200);
  },
  profile(){
    const defense=teamList(SAVE.defense);
    return{name:(SAVE.name||'Aventureiro').slice(0,20),rating:SAVE.rating,wins:SAVE.wins,losses:SAVE.losses,power:teamPower(defense),defense,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
  },
  publishProfile(){if(!this.online||!SAVE.name)return;this.db.collection('players').doc(this.uid).set(this.profile(),{merge:true}).catch(e=>console.warn(e));},
  async opponents(){
    if(!this.online)return makeBots(3);
    try{
      const r=SAVE.rating;
      const snap=await this.db.collection('players').where('rating','>=',r-250).where('rating','<=',r+250).orderBy('rating').limit(30).get();
      let list=snap.docs.filter(d=>d.id!==this.uid).map(d=>({uid:d.id,...d.data()})).filter(p=>Array.isArray(p.defense)&&p.defense.length===4&&p.defense.every(t=>DEFS[t.k]&&HERO_KEYS.includes(t.k)));
      list=list.sort(()=>Math.random()-.5).slice(0,3).map(p=>({uid:p.uid,name:String(p.name||'Jogador').slice(0,20),rating:p.rating|0,team:p.defense.map(t=>({k:t.k,lvl:clamp(t.lvl|0,1,MAX_LVL)})),power:p.power|0}));
      if(list.length<3)list=list.concat(makeBots(3-list.length));
      return list;
    }catch(e){console.warn(e);toast('Não consegui buscar jogadores agora. Mostrando oponentes simulados.');return makeBots(3);}
  },
  async leaderboard(){
    if(!this.online)return null;
    try{const s=await this.db.collection('players').orderBy('rating','desc').limit(50).get();return s.docs.map(d=>({uid:d.id,name:String(d.data().name||'Jogador').slice(0,20),rating:d.data().rating|0,power:d.data().power|0}));}
    catch(e){console.warn(e);return null;}
  },
  reportArena(opp,win,delta){
    if(!this.online||!opp||opp.bot)return;
    this.db.collection('players').doc(opp.uid).collection('defenses').add({attacker:(SAVE.name||'Aventureiro').slice(0,20),attackerUid:this.uid,attackerWon:win,delta:clamp(-delta,-32,32),at:firebase.firestore.FieldValue.serverTimestamp()}).catch(e=>console.warn(e));
  },
  async collectDefenses(){
    if(!this.online)return[];
    try{
      const s=await this.db.collection('players').doc(this.uid).collection('defenses').limit(30).get();
      if(s.empty)return[];
      const out=[];let sum=0;const batch=this.db.batch();
      s.forEach(d=>{const x=d.data();sum+=clamp(x.delta|0,-32,32);out.push({name:String(x.attacker||'Alguém').slice(0,20),won:!x.attackerWon,delta:x.delta|0});batch.delete(d.ref);});
      SAVE.rating=Math.max(0,SAVE.rating+clamp(sum,-200,60));
      SAVE.log=[...out.map(o=>({...o,at:Date.now()})),...SAVE.log].slice(0,10);
      await batch.commit();persist();
      return out;
    }catch(e){console.warn(e);return[];}
  }
};

    el.addEventListener('pointermove',e=>{if(this.drag)this.yaw=this.drag.yaw+(e.clientX-this.drag.x)*.013;});
    const end=()=>{this.drag=null;clearTimeout(this._t);this._t=setTimeout(()=>{this.auto=true;},2500);};
    el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);

  },
  mount(host,key,locked){
    this.host=host;
    if(!this.init()){host.insertAdjacentHTML('beforeend',`<img src="${portrait(key)}" alt="" style="position:absolute;inset:0;margin:auto;width:60%;height:auto">`);return;}

    if(locked)m.root.traverse(o=>{if(o.isSprite)o.visible=false;else if(o.material&&o.material!==OUTLINE)o.material=silhouetteMat;});
    this.model=m;this.key=key;this.locked=locked;this.scene.add(m.root);this.pop=0;
    const c=locked?0x6a5a7a:ELEM[DEFS[key].el].c;this.ringMat.color.set(c);this.glow.material.color.set(c);
  },
  fit(){
    const w=this.host.clientWidth,h=this.host.clientHeight;if(!w||!h)return false;
    if(w!==this.w||h!==this.h){
      this.w=w;this.h=h;this.r.setSize(w,h,false);this.cam.aspect=w/h;
      const hf=Math.tan(THREE.MathUtils.degToRad(15));
      const dist=Math.max(1.75/hf,1.45/(hf*this.cam.aspect));
      this.cam.position.set(0,1.75,dist);this.cam.lookAt(0,1.25,0);this.cam.updateProjectionMatrix();
    }
    return true;
  },
  tick(dt){
    if(!this.r||!this.host||!this.host.isConnected||!this.model||screenEl.hidden)return;
    if(!this.fit())return;
    this.t+=dt;if(this.auto)this.yaw+=dt*.55;
    const m=this.model,b=Math.sin(this.t*3.2);
    m.root.rotation.y=this.yaw;
    this.pop=Math.min(1,this.pop+dt*3.2);const p=E.out(this.pop);
    m.root.scale.setScalar(.6+.4*p);m.root.position.y=(1-p)*.6;
    m.body.position.y=b*.03;m.body.scale.set(1-b*.012,1+b*.025,1-b*.012);
    m.armL.rotation.z=-.15-b*.05;m.armR.rotation.z=.15+b*.05;
    if(m.cape)m.cape.rotation.x=.14+Math.sin(this.t*2.6)*.05;
    if(m.familiar){m.familiar.position.y=1.6+Math.sin(this.t*2)*.12;m.familiar.rotation.y=this.t;}
    this.r.render(this.scene,this.cam);
  }
};
